# Eclipse Mosquitto Configuration
# Smart Recycling IoT System - De Tai 59

# =====================================================
# STANDARD MQTT (TCP) LISTENER (For ESP32 & Wokwi)
# =====================================================
listener 1883
protocol mqtt
allow_anonymous true

# =====================================================
# WEBSOCKETS LISTENER (For Web Browser Dashboard)
# =====================================================
listener 9001
protocol websockets
allow_anonymous true

# Logging settings
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistence
persistence false
